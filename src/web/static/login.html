<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Email Parser & Downloader</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent-danger);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">📥</div>
        <span>Email Parser Portal</span>
      </div>
      <p class="login-subtitle">On-Premises Intake & Attachment Service</p>

      <div id="login-error" class="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus placeholder="admin">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; padding: 0.75rem;">
          Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("login-error");
      const submitBtn = document.getElementById("login-btn");
      
      errBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating...";

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          window.location.href = "/";
        } else {
          errBox.textContent = data.message || "Invalid username or password.";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.textContent = "Failed to connect to server.";
        errBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
