[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-email-parser"
version = "1.0.0"
description = "Secure on-premises automatic email parser and attachment downloader"
authors = [{ name = "Local Server" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0"
]
